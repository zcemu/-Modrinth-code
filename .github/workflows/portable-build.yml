# Portable Modrinth App: cloud build for Windows (no local toolchain needed).
#
# One-time setup:
#   1. Fork modrinth/code on GitHub.
#   2. Copy apply_portable.py (sibling of this file) to the fork's root,
#      commit + push.
#   3. Copy this file to the fork's .github/workflows/portable-build.yml,
#      commit + push.
#   4. Open the fork's Actions tab and manually run
#      "Build portable Modrinth App (Windows)".
#   5. When it finishes (first build takes ~30-60 min), download the
#      `modrinth-app-portable-windows` artifact.
#
# Build notes (verified against modrinth/code main, 2026-10-05):
#   - Uses the stock tauri.conf.json (productName/mainBinaryName "Modrinth App",
#     identifier "ModrinthApp"). It has NO signCommand and NO updater, so the
#     fork build needs neither DigiCert secrets nor dasel surgery. Building
#     with tauri-release.conf.json instead would require stripping
#     bundle.windows.signCommand (jsign) and would enable the auto-updater --
#     which must NOT happen, because a portable build must never auto-update
#     itself into an official release.
#   - The `tauri` package script exists ("tauri": "tauri"), so
#     `pnpm --filter=@modrinth/app run tauri build` works out of the box.
#   - .nvmrc (Node 24.15.0) and packages/app-lib/.env.prod both exist upstream.
#
# Usage: put "Modrinth App.exe" anywhere (e.g. D:\MC\), create an empty file
# named `portable.txt` next to it, and launch. All launcher data
# (database, logs, backups, instances, downloads, WebView2 cache) goes to
# .\data\ next to the exe. Without portable.txt it behaves like stock.

name: Build portable Modrinth App (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ' '

      - name: Apply portable-mode source change
        shell: bash
        run: python apply_portable.py

      - name: Use prod env for app-lib
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows app (NSIS, unsigned, no updater)
        shell: pwsh
        run: pnpm --filter=@modrinth/app run tauri build --bundles nsis

      - name: Upload portable exe + installer
        uses: actions/upload-artifact@v4
        with:
          name: modrinth-app-portable-windows
          path: |
            target/release/Modrinth App.exe
            target/release/bundle/nsis/*.exe
